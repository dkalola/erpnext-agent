services:
  erpnext-agent:
    build:
      context: .
    container_name: erpnext-agent
    env_file:
      - .env.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - frappe_docker_sites:/sites
    networks:
      - frappe_docker_frappe_network
    restart: unless-stopped

networks:
  frappe_docker_frappe_network:
    external: true

volumes:
  frappe_docker_sites:
    external: true
